%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.77.0.0/16,192.0.2.0/24]"
    EXTERNAL_NET: "any"
af-packet:
  - interface: mon0
    cluster-id: 97
    cluster-type: cluster_flow
    defrag: yes
app-layer:
  protocols:
    dns:
      udp:
        enabled: yes
      tcp:
        enabled: yes
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - dns
        - flow
