[paths]
data = /run/ztlab/observability/grafana/data
logs = /run/ztlab/observability/grafana/logs
plugins = /run/ztlab/observability/grafana/plugins
bundled_plugins = /opt/ztlab-observability/grafana/data/plugins-bundled
provisioning = /run/ztlab/observability/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = 127.0.0.1

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[plugins]
plugin_admin_enabled = false
plugin_admin_external_manage_enabled = false
preinstall_disabled = true
public_key_retrieval_disabled = true

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[security]
admin_user = operator
admin_password = ${password}

[users]
allow_sign_up = false
