---
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: isolated-ztlab
    scheme: https
    metrics_path: /metrics
    tls_config:
      server_name: "${monitor_name}"
      ca_file: /run/ztlab/observability/services.pem
      cert_file: /run/ztlab/observability/observer.pem
      key_file: /run/ztlab/observability/observer.key
    static_configs:
      - targets: ["${monitor_target}"]
